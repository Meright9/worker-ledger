name: 构建桌面应用

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试（Vitest + tsc + cargo test）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm install

      - name: 安装 Python 并生成图标 PNG
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成图标 PNG（CI 内重绘，仓库不含二进制）
        run: pip install pillow && python make_icon.py
      - name: 生成应用图标
        run: npx @tauri-apps/cli@latest icon frontend/icon.png

      - name: 前端单元测试
        run: npx vitest run

      - name: 前端类型检查
        run: npx tsc --noEmit -p tsconfig.json

      - name: Rust 数据层单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm install

      - name: 安装 Python 并生成图标 PNG
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成图标 PNG（CI 内重绘，仓库不含二进制）
        run: pip install pillow && python make_icon.py

      - name: 生成应用图标
        run: npx @tauri-apps/cli@latest icon frontend/icon.png

      - name: 构建并发布（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 如需去除“未知开发者”警告，可在此配置签名/公证 secret（可选）
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "打工人小账本 v__VERSION__"
          releaseBody: "桌面版构建产物：Windows 安装包与 macOS 镜像。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
